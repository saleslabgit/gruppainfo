name: gruppainfo

services:
    app:
        build:
            context: .
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - composer-cache:/tmp/composer-cache
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 30s

    web:
        image: nginx:1.28.0-alpine
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_healthy

    db:
        image: mysql:8.4.7
        environment:
            MYSQL_DATABASE: gruppainfo
            MYSQL_USER: gruppainfo
            MYSQL_PASSWORD: gruppainfo
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

volumes:
    composer-cache:
    mysql-data:
    vendor:
